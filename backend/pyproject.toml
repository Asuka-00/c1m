[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>=2.13.5",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.46,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.70.0,<3.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "pwdlib[argon2]>=0.3.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic", "/tests/", "app/testing/"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
    "D",      # pydocstyle (Google 风格中文文档字符串，见 docs/development.md「注释规范」)
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "D415",  # 中文摘要以「。」结尾，D415 只认 . ! ?
    "D105",  # 魔术方法无需文档字符串
]

[tool.ruff.lint.per-file-ignores]
# conftest must point the settings at the separate test database (env vars) and
# migrate it BEFORE importing `app`, so its later imports are intentionally not at the top.
"conftest.py" = ["E402", "D"]
# 测试、测试工具、迁移与脚本不强制文档字符串
"**/tests/**" = ["D"]
"app/testing/**" = ["D"]
"app/alembic/**" = ["D"]
"scripts/**" = ["D"]
# Pydantic / SQLModel 模型的类文档字符串会进入 OpenAPI schema 的 description；
# 为保持 API 契约不变，这些类用 `#` 注释说明，不强制 D101。路由函数的文档字符串
# 同样会成为 OpenAPI 的 description，接口说明由路径 / summary 承担，不强制 D103。
# 已有的接口 / schema 文档字符串保持原样（含格式），避免 OpenAPI 文本变化。
"**/models.py" = ["D101", "D106", "D200", "D205", "D209", "D212"]
"**/schemas.py" = ["D101", "D106", "D200", "D205", "D209", "D212"]
"**/router*.py" = ["D101", "D103", "D200", "D202", "D205", "D209", "D212", "D403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["app"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "app/testing/*"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.src]
exclude = ["**/tests/**", "app/testing/**"]

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"
