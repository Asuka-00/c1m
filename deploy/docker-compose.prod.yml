# 生产部署：postgres 17 + 迁移（一次性）+ FastAPI 后端 + nginx 前端
# 用法：cd deploy && docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: fsft

x-backend-env: &backend-env
  PROJECT_NAME: ${PROJECT_NAME:-FSFT MES}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
  FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@example.com}
  FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME:-admin}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD required}
  # 运行时使用非 owner 角色 app_user（NOBYPASSRLS），行级安全生效
  DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?APP_DB_PASSWORD required}@db:5432/${POSTGRES_DB:-app}
  # 迁移 / 建角色使用 postgres 超级用户（表 owner）
  MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-app}
  QTIME_SWEEP_SECONDS: ${QTIME_SWEEP_SECONDS:-60}
  SMTP_HOST: ${SMTP_HOST:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性：迁移 → app_user 角色与授权 → 初始数据（菜单同步、超级用户）→ 可选演示数据
  migrate:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: fsft-backend:latest
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-0}
    command: >
      sh -c "alembic upgrade head &&
             python scripts/setup_db_roles.py &&
             python -m app.initial_data &&
             if [ \"$$SEED_DEMO\" = 1 ]; then python scripts/mes_demo.py seed; fi"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: fsft-backend:latest
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/app/backend/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: fsft-frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
