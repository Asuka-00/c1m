[project]
name = "cim-equipment-simulator"
version = "0.1.0"
description = "CIM 设备模拟器（P2-E5 模式 A：YAML 场景 -> MES HTTP 接口）"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sim = "sim.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
