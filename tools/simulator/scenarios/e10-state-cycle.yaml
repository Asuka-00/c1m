# 现在就能跑：用现有 POST /mes/eqp/{id}/e10 做设备状态循环 SBY -> PRD -> SBY
name: e10-state-cycle
run_id: e10-cycle-01
target: http://127.0.0.1:8013
description: 设备状态变化（模式 A 冒烟）。E10 接口不收 external_event_id，ID 写进 comment 和 Idempotency-Key。
equipment: [{code: EAP-DA01, type: DIEBOND}]
steps:
  - precondition: {eq: EAP-DA01, e10: SBY}
  - state: {eq: EAP-DA01, to: PRD}
  - state: {eq: EAP-DA01, to: SBY}
  # D65 补充 4：请求体未知字段一律 422 unknown_field（含自定义 EAP/执行接口）。to 填当前状态，后端不拦也不会改状态。
  # 1a7c0fb 的 E10In 没有 extra=forbid（未知字段被忽略），后端下个提交修好前标 xfail；--strict-xfail / SIM_XFAIL=0 可强制判
  - expect_body_422: {eq: EAP-DA01, to: SBY, extra: {bogus: 1}, code: unknown_field, loc: [body, bogus], xfail: "1a7c0fb E10In 未禁止未知字段，待后端下个提交"}
