# 草稿（P3-B8，D58 + D70 + D70 补充；测试计划 PEND-B8-01/02）：按报警码 track_in_action 拦进站。B8 未落地，整体 skipped，不连后端。
# D70：每个报警码加 track_in_action（off/warn/block，默认 off，所有设备类型适用）。进站取机台上所有未清除报警中最严的一档：
#   block → 409 check_blocked，ctx.reason=alarm_severity，overridable=false；warn → 200 + warnings[]；off 不参与。
#   未登记 ALID 不参与；清除后立即放行；全程不 Hold 批次（D58）。
# D70 补充（响应结构与配置）：
#   - warn：进站 200 响应 warnings[]，每条 {code: alarm_severity, ctx: {alarms: [...]}}
#   - block：409 的 ctx.alarms[]，每条 {alid, alarm_code, track_in_action}；block 排前、同档按发生时间；ctx.reason=alarm_severity
#   - 改配置：PATCH /mes/alarm_code/{rid}；非法值 422 enum，ctx.expected=[off, warn, block]
#   - 设备类型层传 null → 422；单台设备覆盖层传 null → 清空、改为继承
#   - 只读 effective_track_in_action（覆盖层优先，否则类型层，否则 off）
#   - eap_service 不能改 track_in_action（403）
# 复用：seed_alarm_code、alarm_set / alarm_clear（manual / b11 都能走）、track_in、expect_hold、expect_eap_read 用的服务账号。
# 草稿步骤（B8 落地后核对）：set_track_in_action {eq, alid, level: type|equipment, value, as?}、expect_effective_track_in_action。
# 报警码 action=none，不联动设备状态；设备全程 SBY。前提：EAP-DA01 SBY；FX0001～FX0005 waiting；9999 未登记。
name: alarm-track-in-action
run_id: alarm-tia-02
draft: "等 P3-B8（D70 / D70 补充 track_in_action、effective_track_in_action、alarm_severity 进站检查）落地"
target: http://127.0.0.1:8013
equipment: [{code: EAP-DA01, type: DIEBOND}]
steps:
  - precondition: {eq: EAP-DA01, e10: SBY}
  - precondition: {lot: FX0001, lot_status: waiting}
  - precondition: {lot: FX0002, lot_status: waiting}
  - precondition: {lot: FX0003, lot_status: waiting}
  - precondition: {lot: FX0004, lot_status: waiting}
  - precondition: {lot: FX0005, lot_status: waiting}
  # 报警码种子：2101～2104 单台设备覆盖层；2105 只配类型层（覆盖层优先用例）
  - seed_alarm_code: {eq: EAP-DA01, alid: "2101", action: none}
  - seed_alarm_code: {eq: EAP-DA01, alid: "2102", action: none}
  - seed_alarm_code: {eq: EAP-DA01, alid: "2103", action: none}
  - seed_alarm_code: {eq: EAP-DA01, alid: "2104", action: none}
  # 默认 off
  - expect_effective_track_in_action: {eq: EAP-DA01, alid: "2104", value: "off"}
  - set_track_in_action: {eq: EAP-DA01, alid: "2101", level: equipment, value: "off", expect: {status: 200}}
  - set_track_in_action: {eq: EAP-DA01, alid: "2102", level: equipment, value: warn, expect: {status: 200}}
  - set_track_in_action: {eq: EAP-DA01, alid: "2103", level: equipment, value: block, expect: {status: 200}}
  - expect_effective_track_in_action: {eq: EAP-DA01, alid: "2103", value: block}
  # 非法值 422 enum，ctx.expected
  - set_track_in_action: {eq: EAP-DA01, alid: "2104", level: equipment, value: bogus,
                          expect: {status: 422, code: enum, loc: [body, track_in_action], ctx: {expected: ["off", warn, block]}}}
  # 只读字段不能写
  - set_track_in_action: {eq: EAP-DA01, alid: "2104", level: equipment, field: effective_track_in_action, value: block,
                          expect: {status: 422, code: read_only_field, loc: [body, effective_track_in_action]}}
  # eap_service 不能改（D65 / D70 补充）
  - set_track_in_action: {eq: EAP-DA01, alid: "2103", level: equipment, value: "off", as: svc, expect: {status: 403}}
  - expect_effective_track_in_action: {eq: EAP-DA01, alid: "2103", value: block}

  # ① off + 未登记 ALID：都不参与 → 200，warnings[] 里没有 alarm_severity；不 Hold
  - alarm_set: {eq: EAP-DA01, alid: "2101"}
  - alarm_set: {eq: EAP-DA01, alid: "2104"}
  - alarm_set: {eq: EAP-DA01, alid: "9999", expect: {body: {data.unregistered: true}}}
  - expect_hold: {lot: FX0001, present: false}
  - track_in: {eq: EAP-DA01, lot: FX0001, expect: {status: 200, absent_warning: alarm_severity}}
  - expect_hold: {lot: FX0001, present: false}

  # ② warn(2102) 先发生、block(2103) 后发生：取 block → 409；ctx.alarms block 排前（2103, 2102）
  - alarm_set: {eq: EAP-DA01, alid: "2102"}
  - alarm_set: {eq: EAP-DA01, alid: "2103"}
  - expect_hold: {lot: FX0002, present: false}
  - track_in:
      eq: EAP-DA01
      lot: FX0002
      expect:
        status: 409
        code: check_blocked
        check: {check_type: alarm_severity, overridable: false}
        body: {detail.ctx.reason: alarm_severity,
               detail.ctx.alarms.0: {alid: "2103", track_in_action: block},
               detail.ctx.alarms.1: {alid: "2102", track_in_action: warn}}
        ctx_alarms_keys: [alid, alarm_code, track_in_action]
  - expect_hold: {lot: FX0002, present: false}

  # ③ 清掉 block → 只剩 warn → 立即 200 + warnings[{code: alarm_severity, ctx.alarms: [2102]}]
  - alarm_clear: {eq: EAP-DA01, alid: "2103", expect: {body: {cleared: true}}}
  - track_in:
      eq: EAP-DA01
      lot: FX0002
      expect: {status: 200, warning: {code: alarm_severity, ctx.alarms: [{alid: "2102", track_in_action: warn}]}}
  - expect_hold: {lot: FX0002, present: false}

  # ④ 再报 block → 拦；清掉 block 和 warn → 马上放行，不带 alarm_severity 警告
  - alarm_set: {eq: EAP-DA01, alid: "2103"}
  - track_in: {eq: EAP-DA01, lot: FX0003, expect: {status: 409, code: check_blocked, check: {check_type: alarm_severity, overridable: false}}}
  - expect_hold: {lot: FX0003, present: false}
  - alarm_clear: {eq: EAP-DA01, alid: "2103", expect: {body: {cleared: true}}}
  - alarm_clear: {eq: EAP-DA01, alid: "2102", expect: {body: {cleared: true}}}
  - track_in: {eq: EAP-DA01, lot: FX0003, expect: {status: 200, absent_warning: alarm_severity}}
  - expect_hold: {lot: FX0003, present: false}

  # ⑤ 覆盖层优先：2105 类型层 block，单台覆盖层 off → 生效 off，不拦；覆盖层传 null 清空 → 继承 block，拦
  - seed_alarm_code: {eq: EAP-DA01, alid: "2105", action: none, level: type}
  - set_track_in_action: {eq: EAP-DA01, alid: "2105", level: type, value: block, expect: {status: 200}}
  - set_track_in_action: {eq: EAP-DA01, alid: "2105", level: type, value: null,
                          expect: {status: 422, loc: [body, track_in_action]}}
  - seed_alarm_code: {eq: EAP-DA01, alid: "2105", action: none}
  - set_track_in_action: {eq: EAP-DA01, alid: "2105", level: equipment, value: "off", expect: {status: 200}}
  - expect_effective_track_in_action: {eq: EAP-DA01, alid: "2105", value: "off"}
  - alarm_set: {eq: EAP-DA01, alid: "2105"}
  - track_in: {eq: EAP-DA01, lot: FX0004, expect: {status: 200, absent_warning: alarm_severity}, save_as: ti4}
  - expect_hold: {lot: FX0004, present: false}
  - set_track_in_action: {eq: EAP-DA01, alid: "2105", level: equipment, value: null, expect: {status: 200, body: {data.track_in_action: null}}}
  - expect_effective_track_in_action: {eq: EAP-DA01, alid: "2105", value: block}
  # 继承类型层 block → 另一批 FX0005 进站被拦
  - track_in: {eq: EAP-DA01, lot: FX0005, expect: {status: 409, code: check_blocked, check: {check_type: alarm_severity, overridable: false}}}
  - expect_hold: {lot: FX0005, present: false}
  - alarm_clear: {eq: EAP-DA01, alid: "2105", expect: {body: {cleared: true}}}

  # 收尾
  - alarm_clear: {eq: EAP-DA01, alid: "2101", expect: {body: {cleared: true}}}
  - alarm_clear: {eq: EAP-DA01, alid: "2104", expect: {body: {cleared: true}}}
  - alarm_clear: {eq: EAP-DA01, alid: "9999"}
  - expect_e10: {eq: EAP-DA01, state: SBY}
