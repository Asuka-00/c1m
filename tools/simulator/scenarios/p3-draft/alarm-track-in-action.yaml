# 草稿（P3-B8，D58 + D70；测试计划 PEND-B8-01/02）：按报警码 track_in_action 拦进站。B8 未落地，整体 skipped，不连后端。
# D70：每个报警码新增配置 track_in_action（off/warn/block，默认 off，所有设备类型适用，不按类型硬编码）。
#   进站取机台上所有「未清除」报警中最严的一档：block → 409 check_blocked，reason=alarm_severity，overridable=false；
#   warn → 200 + 警告；off 不参与。未登记 ALID 不参与。报警清除后立即放行。全程不 Hold 批次（D58）。
# 复用：seed_alarm_code（报警码种子）、alarm_set / alarm_clear（manual 与 b11 两种模式都能走）、track_in（进站检查）、expect_hold。
# 草稿步骤（B8 落地后核对）：set_track_in_action（改配置）、expect_alarm_code（查配置）。
# 报警码都用 action=none，不联动设备状态，避免 D58 的 e10_available 拦截混进来；设备全程保持 SBY。
# 前提：EAP-DA01 起始 SBY、工步配了报警等级检查项（项名待定，见 README）；FX0001～FX0003 waiting；2101～2104 由本场景写种子，9999 未登记。
name: alarm-track-in-action
run_id: alarm-tia-01
draft: "等 P3-B8（D70 track_in_action / alarm_severity 进站检查）落地"
target: http://127.0.0.1:8013
equipment: [{code: EAP-DA01, type: DIEBOND}]
steps:
  - precondition: {eq: EAP-DA01, e10: SBY}
  - precondition: {lot: FX0001, lot_status: waiting}
  - precondition: {lot: FX0002, lot_status: waiting}
  - precondition: {lot: FX0003, lot_status: waiting}
  # 报警码种子（action=none）；2104 不设 track_in_action，验证默认 off
  - seed_alarm_code: {eq: EAP-DA01, alid: "2101", action: none}
  - seed_alarm_code: {eq: EAP-DA01, alid: "2102", action: none}
  - seed_alarm_code: {eq: EAP-DA01, alid: "2103", action: none}
  - seed_alarm_code: {eq: EAP-DA01, alid: "2104", action: none}
  - expect_alarm_code: {eq: EAP-DA01, alid: "2104", fields: {track_in_action: "off"}}
  - set_track_in_action: {eq: EAP-DA01, alid: "2101", value: "off", expect: {status: 200}}
  - set_track_in_action: {eq: EAP-DA01, alid: "2102", value: warn, expect: {status: 200}}
  - set_track_in_action: {eq: EAP-DA01, alid: "2103", value: block, expect: {status: 200}}
  - set_track_in_action: {eq: EAP-DA01, alid: "2104", value: bogus, expect: {status: 422, loc: [body, track_in_action]}}

  # ① off + 未登记 ALID：都不参与 → 进站 200，无报警等级警告；不 Hold
  - alarm_set: {eq: EAP-DA01, alid: "2101"}
  - alarm_set: {eq: EAP-DA01, alid: "2104"}
  - alarm_set: {eq: EAP-DA01, alid: "9999", expect: {body: {data.unregistered: true}}}
  - expect_hold: {lot: FX0001, present: false}
  - track_in: {eq: EAP-DA01, lot: FX0001, expect: {status: 200, absent_warning: alarm_severity}}
  - expect_hold: {lot: FX0001, present: false}

  # ② warn + block 同时未清除：取最严的 block → 409 check_blocked / alarm_severity / overridable=false；不 Hold
  - alarm_set: {eq: EAP-DA01, alid: "2102"}
  - alarm_set: {eq: EAP-DA01, alid: "2103"}
  - expect_hold: {lot: FX0002, present: false}
  - track_in:
      eq: EAP-DA01
      lot: FX0002
      expect: {status: 409, code: check_blocked, check: {check_type: alarm_severity, overridable: false},
               body: {detail.reason: alarm_severity, detail.overridable: false}}
  - expect_hold: {lot: FX0002, present: false}

  # ③ 清掉 block（2103）后只剩 warn → 立即放行：200 + 报警等级警告（警告结构待定，见 README）；不 Hold
  - alarm_clear: {eq: EAP-DA01, alid: "2103", expect: {body: {cleared: true}}}
  - track_in: {eq: EAP-DA01, lot: FX0002, expect: {status: 200, warning: {check_type: alarm_severity, alid: "2102"}}}
  - expect_hold: {lot: FX0002, present: false}

  # ④ 再报 block → 拦；同时清掉 block 和 warn → 马上放行，且不再带警告；不 Hold
  - alarm_set: {eq: EAP-DA01, alid: "2103"}
  - track_in: {eq: EAP-DA01, lot: FX0003, expect: {status: 409, code: check_blocked, check: {check_type: alarm_severity, overridable: false}}}
  - expect_hold: {lot: FX0003, present: false}
  - alarm_clear: {eq: EAP-DA01, alid: "2103", expect: {body: {cleared: true}}}
  - alarm_clear: {eq: EAP-DA01, alid: "2102", expect: {body: {cleared: true}}}
  - track_in: {eq: EAP-DA01, lot: FX0003, expect: {status: 200, absent_warning: alarm_severity}}
  - expect_hold: {lot: FX0003, present: false}
  # 收尾：off 与未登记的报警仍未清除，但一直没拦过；清掉，设备状态始终 SBY
  - alarm_clear: {eq: EAP-DA01, alid: "2101", expect: {body: {cleared: true}}}
  - alarm_clear: {eq: EAP-DA01, alid: "2104", expect: {body: {cleared: true}}}
  - alarm_clear: {eq: EAP-DA01, alid: "9999"}
  - expect_e10: {eq: EAP-DA01, state: SBY}
