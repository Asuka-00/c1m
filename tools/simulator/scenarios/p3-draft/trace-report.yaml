# 草稿（P3-B3 打标追溯与出货标签一致性）：B3 未落地，整体 skipped，不连后端。
# 依据：
#   - p3-tasks.md「P3-B3」：追溯支持 kind=trace_code，反查批次、谱系、晶圆；出货标签生成时比对打标内容，不一致 409 label_marking_mismatch；
#     权限沿用 mes.exec:read。验收：追溯码查到晶圆 ID；标签内容与打标不符时不能打印。
#   - p3-tasks.md「B1→B2→B3 开工清单与验收要点」B3：GET /mes/exec/trace?kind=trace_code，mes.exec:read，include_voided；
#     结果形状按 D79-6；验收：作废前后追溯、跨租户隔离、与出货标签一致性。
#   - D79-5：追溯默认不含已作废，include_voided=true 才含；作废后同批次可重新首打（新主记录、seq 从 1）。
#   - D79-6：kind=trace_code 结果 {marking_id, lot_id, trace_code, voided, prints[{print_id, seq, marked_at, latest_inspection_result}]}。
#   - D79 补充 1：沿用 GET /mes/exec/trace?kind=trace_code&code=，权限 mes.exec:read，不新增 mes.trace:read。
#   - D78 补充一 2：label_marking_mismatch 只作 B3 出货标签比对的 409 错误码（OCR 不一致事件是 lot.marking_mismatched）。
#   - D88 补充一：8013 不补账号，as: other_tenant / read_only 无凭据时该步记 skip（由 QA 覆盖）。
#   - D86：通用 404 只断言状态码。
# D91（08:13，定稿 TR-Q1~Q5）：
#   1. 404 按 D86 只断言状态码（D84 Q4 code=not_found 进格式统一批次）
#   2. 追溯结果每条加 wafers[{wafer_id, slot}]，取批次当前晶圆，无则 []
#   3. 标签比对对象 = 未作废主记录 seq 最大打印的 trace_code；不一致 409 label_marking_mismatch ctx {reason: mismatch, marking_id, expected, actual}
#   4. 无未作废主记录或未首打：同 code，ctx.reason=not_marked，marking_id 按 D79（无主记录 null），expected=null
#   5. X-Tenant-ID 为未加入的租户 403；本租户查别租户的码 200 空列表
#   6. code 缺失/空/纯空白 422 missing loc [query, code]；kind 非法 422 value_error loc [query, kind] ctx {reason: invalid_choice, choices}
name: trace-report
run_id: trace-02
draft: "等 P3-B3 落地（GET /mes/exec/trace?kind=trace_code、include_voided、出货标签比对 409 label_marking_mismatch；依赖 B1/B2 与 P2-B2 包装/标签）"
target: http://127.0.0.1:8013
equipment: [{code: EAP-MK01, type: MARKER}]
steps:
  - precondition: {eq: EAP-MK01, e10: SBY}
  # 种子（B3 落地时补进 seed-p3）：TR0001 片级批次 2 片（D91-2 wafers），TR0002 数量级（wafers []），TR0003 普通；TR0009 属 P-NOMK
  - marking_template_ready: {product: P-MK, customer: C-MK, approved: true, lots: [TR0001, TR0002, TR0003]}

  # ---- ① 作废前：TR0001 建主记录、首打、检验 pass → 默认追溯可查，voided=false
  - marking_create: {lot: TR0001, idem: tr-c1, expect: {status: 200, body: {data.voided: false}}}
  - marking_print: {lot: TR0001, eq: EAP-MK01, idem: tr-p1, expect: {status: 200, body: {data.seq: 1}}}
  - marking_inspect: {lot: TR0001, result: pass, read_code: $issued, idem: tr-i1, expect: {status: 200}}
  - expect_marking_trace: {code: $issued.TR0001, count: 1,
                           first: {marking_id: $marking.TR0001, lot_id: $lot.TR0001, trace_code: $issued.TR0001, voided: false,
                                   wafers: $nonempty,
                                   prints: [{print_id: $print_seq_1, seq: 1, marked_at: $utc_z, latest_inspection_result: pass}]}}
  - expect_marking_trace: {code: $issued.TR0001, include_voided: true, count: 1, first: {voided: false}}   # include_voided 不影响未作废
  # D91-2：追溯码查到晶圆 ID（B3 卡验收）：wafers[{wafer_id, slot}] 取批次当前晶圆（TR0001 片级批次，2 片）
  - expect_marking_trace: {code: $issued.TR0001, count: 1, first: {wafers: [{wafer_id: $nonempty, slot: $nonempty}, {wafer_id: $nonempty, slot: $nonempty}]}}
  # D91-2：数量级批次（无晶圆）→ wafers: []（TR0002 见⑤）
  # 不存在的码 → 200 空列表
  - expect_marking_trace: {code: NOSUCH-TRACE-01, count: 0}
  - expect_marking_trace: {code: NOSUCH-TRACE-01, include_voided: true, count: 0}
  # 权限：mes.exec:read（D79 补充 1）；只读账号可查，无凭据记 skip
  - expect_marking_trace: {code: $issued.TR0001, as: read_only, expect: {status: 200}}
  # D91-6：参数校验
  - expect_marking_trace: {code: $absent, expect: {status: 422, errors: [{type: missing, loc: [query, code]}]}}
  - expect_marking_trace: {code: "", expect: {status: 422, errors: [{type: missing, loc: [query, code]}]}}
  - expect_marking_trace: {code: "   ", expect: {status: 422, errors: [{type: missing, loc: [query, code]}]}}
  - expect_marking_trace: {code: $issued.TR0001, kind: bogus, expect: {status: 422, errors: [{type: value_error, loc: [query, kind], ctx: {reason: invalid_choice, choices: $nonempty}}]}}

  # ---- ② 出货标签一致：TR0001 装箱打标签 → 一致 200；标签内容带 trace_code
  - pack_lot: {pack: PK-TR01, lot: TR0001, idem: tr-pk1, expect: {status: 200}}
  - label_print: {pack: PK-TR01, idem: tr-lb1, expect: {status: 200}}
  - label_print: {pack: PK-TR01, idem: tr-lb1, expect: {status: 200, headers: {Idempotent-Replayed: "true"}}}   # D86 回放

  # ---- ③ 作废后：TR0001 作废 → 默认追溯 0 条；include_voided=true 1 条 voided=true，prints 保留
  - marking_void: {marking: TR0001, reason: R-MKVOID, comment: "追溯草稿作废", idem: tr-v1, expect: {status: 200}}
  - expect_marking_trace: {code: $issued.TR0001, count: 0}
  - expect_marking_trace: {code: $issued.TR0001, include_voided: true, count: 1,
                           first: {marking_id: $marking.TR0001, lot_id: $lot.TR0001, voided: true,
                                   prints: [{seq: 1, latest_inspection_result: pass}]}}   # D79 补充 4：作废后保留原检验结果
  # 作废后（只有已作废主记录）打出货标签 → 不能打印（D91-4）
  # D91-4：只有已作废主记录 → not_marked，marking_id null（D79），expected null
  - label_print: {pack: PK-TR01, idem: tr-lb2, expect: {status: 409, detail_object: true, code: label_marking_mismatch,
                                                         ctx: {reason: not_marked, marking_id: null, expected: null, actual: $nonempty}}}
  # 重新首打：新主记录 seq 从 1，新码；旧码默认仍查不到，新码可查
  - marking_create: {lot: TR0001, idem: tr-c1b, save_as: tr1b, expect: {status: 200, body: {data.voided: false}}}
  - marking_print: {lot: TR0001, eq: EAP-MK01, idem: tr-p1b, expect: {status: 200, body: {data.seq: 1}}}
  - expect_marking_trace: {code: $issued.TR0001, count: 1, first: {marking_id: $marking.tr1b, voided: false, prints: [{seq: 1, latest_inspection_result: null}]}}

  # ---- ④ 标签与打标不一致 → 409 label_marking_mismatch，不能打印
  # D91-3：PK-TR01 标签仍是旧码，新主记录 seq 最大打印码已变 → mismatch；expected=新码，actual=标签码
  - label_print: {pack: PK-TR01, idem: tr-lb3, expect: {status: 409, detail_object: true, code: label_marking_mismatch,
                                                         ctx: {reason: mismatch, marking_id: $marking.tr1b, expected: $issued.TR0001, actual: $nonempty}}}
  # D86：409 不缓存，同 key 重发重新校验，不带 Idempotent-Replayed
  - label_print: {pack: PK-TR01, idem: tr-lb3, expect: {status: 409, code: label_marking_mismatch, absent_headers: [Idempotent-Replayed]}}
  # 未绑定打标模板的产品不比对（D79 补充 5 口径延伸）—— TR0009 属 P-NOMK，不打标直接装箱
  - marking_template_ready: {product: P-NOMK, approved: false, lots: [TR0009]}
  - pack_lot: {pack: PK-TR09, lot: TR0009, idem: tr-pk9, expect: {status: 200}}
  - label_print: {pack: PK-TR09, idem: tr-lb9, expect: {status: 200}}
  # 要求打标但未首打 → 不能打印（D91-4）
  - pack_lot: {pack: PK-TR03, lot: TR0003, idem: tr-pk3, expect: {status: 200}}
  - label_print: {pack: PK-TR03, idem: tr-lb4, expect: {status: 409, detail_object: true, code: label_marking_mismatch,
                                                         ctx: {reason: not_marked, marking_id: null, expected: null}}}
  # D91-4：建了主记录未首打 → not_marked，marking_id 为该主记录，expected null
  - marking_create: {lot: TR0003, idem: tr-c3, save_as: tr3, expect: {status: 200}}
  - label_print: {pack: PK-TR03, idem: tr-lb5, expect: {status: 409, detail_object: true, code: label_marking_mismatch,
                                                         ctx: {reason: not_marked, marking_id: $marking.tr3, expected: null}}}

  # ---- ⑤ 跨租户隔离（X-Tenant-ID）：other_tenant 账号查本租户码 → 空；包装 / 标签 404。无凭据记 skip（D88 补充一，QA 覆盖）
  - marking_create: {lot: TR0002, idem: tr-c2, expect: {status: 200}}
  - marking_print: {lot: TR0002, eq: EAP-MK01, idem: tr-p2, expect: {status: 200, body: {data.seq: 1}}}
  - expect_marking_trace: {code: $issued.TR0002, count: 1, first: {lot_id: $lot.TR0002, wafers: []}}   # D91-2：数量级批次无晶圆
  - expect_marking_trace: {code: $issued.TR0002, as: other_tenant, expect: {status: 200, body: {data: []}}}
  - expect_marking_trace: {code: $issued.TR0002, include_voided: true, as: other_tenant, expect: {status: 200, body: {data: []}}}
  - label_print: {pack: PK-TR01, idem: tr-lbx, as: other_tenant, expect: {status: 404}}
  # D91-5：同账号把 X-Tenant-ID 改成未加入的租户 → 403
  - expect_marking_trace: {code: $issued.TR0002, tenant: NOT-A-MEMBER-TENANT, expect: {status: 403}}
