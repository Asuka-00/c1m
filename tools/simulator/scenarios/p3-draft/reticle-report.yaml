# P3-E2 光罩（eap/p3/docs/p3-e2-reticle-prereview.md）。ret-report-09 对 be/p3 386c4e0 真实接口联调（08 对 f9e9dda：76 ok / 29 未实现 / 0 失败）。
# 去掉 draft；EAP 光罩上报步骤（reticle_report）及依赖它的断言用 needs: 记「未实现」，不算失败：
# B11 还没有光罩 event_type（D67：P3 不开放 EAP 光罩写入），reticle_report 是以后 reticle_mount/reticle_unmount/reticle_usage 的形状。
# 表已支持（不改表）：mount_log / usage / incident 带 source、external_event_id，部分唯一 (tenant_id, source, external_event_id)。
# 覆盖：
#   - EAP 上机：mount_log.source=simulator、external_event_id；同号重发 duplicate=true、不新增挂载行；同号不同内容 422 idempotency_key_reused
#   - EAP 计数：同号重发 duplicate=true、shot_count 不重复加；7 位小数 422 value_error ctx.max_places=6
#   - EAP 下机（D80 G1）：单独记一行下机事件（kind=unmount），沿用 (tenant_id, source, external_event_id) 部分唯一；
#     上机行只回填 unmounted_at、不写下机事件号；重放不多出第二行；同号重复下机 duplicate=true；unmounted_at 不被改写
#   - 已报废：EAP 计数 409 invalid_transition，不计数、不发 life_reached（D72）
#   - D80 G2/G3 + 补充一/二：14 个手工写接口（另含 clean-start/clean-complete/repair-complete/inspect-start）缺 Idempotency-Key 一律 422 missing（loc [header, Idempotency-Key]）；
#     重放按 D57 原状态码 + 原记录、无 duplicate；同 key 不同请求体 422 idempotency_key_reused
#   - D82 第 4 点 + 续：补录时间 mounted_at / occurred_at / unmounted_at（sim/reticle.py 本地预校验）：
#     晚于当前 > 5 分钟 422 value_error ctx.reason=future_time（卡 4:59/5:00/5:01，5:00 放行）；无时区 422 timezone_required（body 阶段，先于 404）；
#     早于该光罩最近一次下机/事件 409 time_out_of_order（404 之后）；unmounted_at 早于对应 mounted_at 409，相等合法
#   - D82 续二（03:19）：mount/unmount 先后基准 = 状态履历与历次下机最晚者（usage/检查不计）；incident 另计最近 usage；
#     incident 顺带下机用 occurred_at（无则当前时间）；occurred_at < 当前 mounted_at → 整体 409，不 Hold、不下机、不写事件
#   - D80 G5：mounted / unmounted / life_reached 带 source、external_event_id（手工为 null）；G6：source ∈ manual/eap/simulator/system
name: reticle-report
run_id: ret-report-10
target: http://127.0.0.1:8013
equipment: [{code: EAP-LT01, type: LITHO}]
steps:
  - precondition: {eq: EAP-LT01, e10: SBY}
  # ---- 上机
  - reticle_report: {eq: EAP-LT01, reticle: R-SIM-03, kind: mount, seq: 1, payload: {slot_code: S1}, save_as: m1,
                     expect: {status: 200, body: {duplicate: false}}}
  - reticle_replay: {of: m1, expect: {status: 200, body: {duplicate: true}}}
  - expect_reticle_history: {needs: [m1], reticle: R-SIM-03, latest_of: mount, count_of: {mount: 1},
                             fields: {source: simulator, external_event_id: $ext.m1, slot_code: S1, unmounted_at: null}}
  - reticle_report: {save_as: m1b, eq: EAP-LT01, reticle: R-SIM-03, kind: mount, seq: 1, payload: {slot_code: S2},
                     expect: {status: 422, code: idempotency_key_reused, detail_object: true}}
  - expect_reticle: {needs: [m1], reticle: R-SIM-03, fields: {status_code: in_use, mount_count: 1}}
  - expect_reticle_events: {needs: [m1], reticle: R-SIM-03, latest: {event: reticle.mounted, payload.source: simulator, payload.external_event_id: $ext.m1}}   # D80 G5
  # ---- 计数
  - reticle_report: {eq: EAP-LT01, reticle: R-SIM-03, kind: usage, seq: 2, payload: {delta: "100"}, save_as: u1,
                     expect: {status: 200, body: {duplicate: false}}}
  - reticle_replay: {of: u1, expect: {status: 200, body: {duplicate: true}}}
  - expect_reticle: {needs: [u1], reticle: R-SIM-03, fields: {shot_count: "100"}}
  - expect_reticle_history: {needs: [u1], reticle: R-SIM-03, latest_of: usage, count_of: {usage: 1}, fields: {source: simulator, external_event_id: $ext.u1, delta: "100"}}
  - reticle_report: {save_as: u1b, eq: EAP-LT01, reticle: R-SIM-03, kind: usage, seq: 2, payload: {delta: "101"},
                     expect: {status: 422, code: idempotency_key_reused, detail_object: true}}
  - reticle_report: {save_as: u1c, eq: EAP-LT01, reticle: R-SIM-03, kind: usage, seq: 3, payload: {delta: "1.1234567"},
                     expect: {status: 422, type: value_error, loc: [body, payload, delta], ctx: {max_places: 6}}}
  - expect_reticle: {needs: [u1], reticle: R-SIM-03, fields: {shot_count: "100"}}
  # ---- 对照：手工 usage 重放（D57）无 duplicate 字段
  - reticle_adjust: {reticle: R-SIM-03, delta: "5", idem: ret-man-1, save_as: a1, expect: {status: 200, absent: [duplicate]}}
  - reticle_replay: {of: a1, expect: {status: 200, absent: [duplicate]}}
  - expect_reticle: {needs: [u1], reticle: R-SIM-03, fields: {shot_count: "105"}}
  # ---- 下机（D80 G1）：单独一行下机事件
  - reticle_report: {eq: EAP-LT01, reticle: R-SIM-03, kind: unmount, seq: 4, save_as: um1, expect: {status: 200, body: {duplicate: false}}}
  - expect_reticle_history: {needs: [um1], reticle: R-SIM-03, latest_of: mount, save_as: mrow1,
                             fields: {source: simulator, external_event_id: $ext.m1, unmounted_at: $utc_z}}   # 上机行只回填 unmounted_at
  - expect_reticle_history: {needs: [um1], reticle: R-SIM-03, latest_of: unmount, count_of: {unmount: 1},
                             fields: {source: simulator, external_event_id: $ext.um1}}
  # 重放：duplicate=true，不多出第二行下机事件，上机行 unmounted_at 不被改写
  - reticle_replay: {of: um1, expect: {status: 200, body: {duplicate: true}}}
  - expect_reticle_history: {needs: [um1], reticle: R-SIM-03, count_of: {unmount: 1, mount: 1}}
  - expect_reticle_history: {needs: [um1], reticle: R-SIM-03, latest_of: mount, fields: {unmounted_at: $mrow1.unmounted_at, external_event_id: $ext.m1}}
  # EAP 同一事件号再次下机（重新构造同内容请求）→ duplicate=true
  - reticle_report: {save_as: um1b, eq: EAP-LT01, reticle: R-SIM-03, kind: unmount, seq: 4, expect: {status: 200, body: {duplicate: true}}}
  - expect_reticle_history: {needs: [um1], reticle: R-SIM-03, count_of: {unmount: 1}}
  - expect_reticle_events: {needs: [um1], reticle: R-SIM-03, count: {reticle.unmounted: 1},
                            latest: {event: reticle.unmounted, payload.source: simulator, payload.trigger: manual, payload.external_event_id: $ext.um1}}
  # ---- D80 补充一：10 个手工写接口缺 Idempotency-Key → 422 missing（loc header），不进业务
  # 前提（QA N-E6，D81 已定）：缺 Idempotency-Key 422 先于状态 409 / 资源 404，故对 available 的 R-SIM-04 调
  #   clean-complete / repair-complete 也是 422 missing
  - reticle_mount: {no_idem: true, eq: EAP-LT01, reticle: R-SIM-04, slot: S9, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_unmount: {no_idem: true, reticle: R-SIM-04, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_adjust: {no_idem: true, reticle: R-SIM-04, delta: "1", expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_incident: {no_idem: true, eq: EAP-LT01, reticle: R-SIM-04, kind: collision, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_inspection: {no_idem: true, reticle: R-SIM-04, kind: particle, result: pass, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_hold: {no_idem: true, reticle: R-SIM-04, reason: x, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_release: {no_idem: true, reticle: R-SIM-04, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_restore: {no_idem: true, reticle: R-SIM-04, reason: x, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_life_reset: {no_idem: true, reticle: R-SIM-04, reason: x, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_scrap: {no_idem: true, reticle: R-SIM-04, reason: x, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_clean_start: {no_idem: true, reticle: R-SIM-04, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_clean_complete: {no_idem: true, reticle: R-SIM-04, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_repair_complete: {no_idem: true, reticle: R-SIM-04, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_inspect_start: {no_idem: true, reticle: R-SIM-04, expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - expect_reticle: {reticle: R-SIM-04, fields: {status_code: available, mount_count: 0, shot_count: "0"}}
  # 手工 mount 带 key：重放原状态码 + 原记录、无 duplicate；同 key 换体 422；事件 source=manual、external_event_id=null
  - reticle_mount: {idem: ret-rep-m4, eq: EAP-LT01, reticle: R-SIM-04, slot: S9, save_as: mm4, expect: {status: 200, absent: [duplicate]}}
  - reticle_replay: {of: mm4, expect: {status: 200, absent: [duplicate]}}
  - reticle_mount: {idem: ret-rep-m4, eq: EAP-LT01, reticle: R-SIM-04, slot: S8, expect: {status: 422, code: idempotency_key_reused, detail_object: true}}
  - expect_reticle_history: {reticle: R-SIM-04, count_of: {mount: 1}, latest_of: mount, fields: {source: manual, external_event_id: null, slot_code: S9}}
  - expect_reticle_events: {reticle: R-SIM-04, latest: {event: reticle.mounted, payload.source: manual, payload.external_event_id: null}}
  - reticle_unmount: {idem: ret-rep-u4, reticle: R-SIM-04, save_as: mu4,
                    expect: {status: 200, body: {data.event_type: mount, data.unmounted_at: $nonempty, unmount_event.event_type: unmount, unmount_event.mount_log_id: $nonempty, unmount_event.source: manual, unmount_event.external_event_id: null}, absent: [duplicate]}}   # D80：data=上机行 + unmount_event；手工无 duplicate
  - reticle_replay: {of: mu4, expect: {status: 200, absent: [duplicate]}}
  - expect_reticle_history: {reticle: R-SIM-04, count_of: {unmount: 1}, latest_of: unmount, fields: {source: manual, external_event_id: null}}
  - expect_reticle_events: {reticle: R-SIM-04, count: {reticle.unmounted: 1},
                            latest: {event: reticle.unmounted, payload.source: manual, payload.external_event_id: null}}
  # G6：source 只能是 manual/eap/simulator/system（EAP 信封 source 非法 → 422）
  - reticle_report: {save_as: g6, eq: EAP-LT01, reticle: R-SIM-03, kind: usage, seq: 9, extra: {source: robot}, payload: {delta: "1"},
                     expect: {status: 422, loc: [body, source]}}
  # ---- 已报废：EAP 计数 409，不计数、不发 life_reached（D72）
  - reticle_scrap: {idem: ret-rep-s3, reticle: R-SIM-03, reason: R-scrap, save_as: sc3, expect: {status: 200}}
  - reticle_scrap: {idem: ret-rep-s3, reticle: R-SIM-03, reason: R-scrap-2, expect: {status: 422, code: idempotency_key_reused, detail_object: true}}
  - reticle_report: {save_as: u3s, eq: EAP-LT01, reticle: R-SIM-03, kind: usage, seq: 5, payload: {delta: "500"},
                     expect: {status: 409, code: invalid_transition}}
  - expect_reticle: {needs: [u1], reticle: R-SIM-03, fields: {status_code: scrapped, shot_count: "105"}}
  - expect_reticle_events: {reticle: R-SIM-03, absent_after: {event: reticle.scrapped}, events: [reticle.life_reached]}
  # life_reached 事件也带 source / external_event_id（D80 G5）：另一片光罩用 EAP 计数打到上限
  - reticle_report: {save_as: m5, eq: EAP-LT01, reticle: R-SIM-05, kind: mount, seq: 10, payload: {slot_code: S5}, expect: {status: 200}}
  - reticle_report: {eq: EAP-LT01, reticle: R-SIM-05, kind: usage, seq: 11, payload: {delta: "200"}, save_as: u5, expect: {status: 200}}
  - expect_reticle_events: {needs: [u5], reticle: R-SIM-05, latest_of: {reticle.life_reached: {payload.source: simulator, payload.external_event_id: $ext.u5}}}
  # D80 补充二：clean-complete 重放返回原状态码 + 原记录（不是 409 invalid_transition）
  - reticle_clean_start: {idem: ret-rep-cs6, reticle: R-SIM-06, expect: {status: 200}}
  - reticle_clean_complete: {idem: ret-rep-cc6, reticle: R-SIM-06, save_as: cc6, expect: {status: 200}}
  - reticle_replay: {of: cc6, expect: {status: 200, absent: [duplicate]}}   # 原状态码，不是 409
  - reticle_clean_complete: {idem: ret-rep-cc6b, reticle: R-SIM-06, expect: {status: 409, code: invalid_transition}}   # 新 key 才是真冲突
  # f9e9dda：清洗无专门事件，记 reticle.status_changed（payload.action=clean-start/clean-complete）；重放不多发
  - expect_reticle_events: {reticle: R-SIM-06, count: {reticle.status_changed: 2}, latest: {event: reticle.status_changed, payload.action: clean-complete, payload.to: inspecting}}
  # D81 校验顺序：不存在的 rid 不带 key → 422（不是 404）；带 key → 404
  - reticle_hold: {no_idem: true, reticle: R-NOT-EXIST, reason: x,
                   expect: {status: 422, code: missing, loc: [header, Idempotency-Key]}}
  - reticle_hold: {idem: ret-rep-ord1, reticle: R-NOT-EXIST, reason: x, expect: {status: 404}}
  # 状态不对（R-SIM-03 已报废）+ 非法 body → 422（不是 409）；合法 body → 409
  - reticle_adjust: {idem: ret-rep-ord2, reticle: R-SIM-03, delta: "1.1234567", expect: {status: 422, loc: [body, delta]}}
  - reticle_adjust: {idem: ret-rep-ord3, reticle: R-SIM-03, delta: "1", expect: {status: 409}}
  # ---- D82 第 4 点 + 续：补录时间边界（相对时间 $now±Ns 由 sim.reticle.resolve_relative 解析）
  # body 阶段：future_time / timezone_required 先于 404（不存在的光罩也是 422）
  - reticle_mount: {idem: ret-rep-bt1, eq: EAP-LT01, reticle: R-NOT-EXIST, slot: S1, mounted_at: "$now+301s",
                    expect: {status: 422, type: value_error, loc: [body, mounted_at], ctx: {reason: future_time}}}
  - reticle_mount: {idem: ret-rep-bt2, eq: EAP-LT01, reticle: R-NOT-EXIST, slot: S1, mounted_at: "2026-10-15T01:00:00",
                    expect: {status: 422, type: timezone_required, loc: [body, mounted_at]}}
  - reticle_mount: {idem: ret-rep-bt3, eq: EAP-LT01, reticle: R-NOT-EXIST, slot: S1, mounted_at: "$now+299s", expect: {status: 404}}
  # mount：5:01 拒；5:00（R-SIM-07）、4:59（R-SIM-08）放行
  - reticle_mount: {idem: ret-rep-bt4, eq: EAP-LT01, reticle: R-SIM-07, slot: S7, mounted_at: "$now+301s",
                    expect: {status: 422, type: value_error, ctx: {reason: future_time}}}
  - reticle_mount: {idem: ret-rep-bt5, eq: EAP-LT01, reticle: R-SIM-07, slot: S7, mounted_at: "$now+300s", save_as: bm7, expect: {status: 200}}
  - reticle_mount: {idem: ret-rep-bt6, eq: EAP-LT01, reticle: R-SIM-08, slot: S8, mounted_at: "$now+299s", expect: {status: 200}}
  # unmount：无时区 / 5:01 → 422；早于对应 mounted_at → 409；相等合法
  - reticle_unmount: {idem: ret-rep-bt7, reticle: R-SIM-07, unmounted_at: "2026-10-15T01:00:00",
                      expect: {status: 422, type: timezone_required, loc: [body, unmounted_at]}}
  - reticle_unmount: {idem: ret-rep-bt8, reticle: R-SIM-07, unmounted_at: "$now+301s",
                      expect: {status: 422, type: value_error, ctx: {reason: future_time}}}
  - reticle_unmount: {idem: ret-rep-bt9, reticle: R-SIM-07, unmounted_at: "$now-1h", expect: {status: 409, code: time_out_of_order}}
  - reticle_unmount: {idem: ret-rep-bt10, reticle: R-SIM-07, unmounted_at: $bm7.mounted_at, expect: {status: 200}}   # 相等合法
  - expect_reticle_history: {reticle: R-SIM-07, latest_of: mount, fields: {mounted_at: $bm7.mounted_at, unmounted_at: $bm7.mounted_at}}
  # D82 补充一（386c4e0 起）：未挂载光罩补录下机 → 先判状态 409 invalid_transition，不再判 time_out_of_order
  - reticle_unmount: {idem: ret-rep-bt10b, reticle: R-SIM-07, unmounted_at: "$now-1h", expect: {status: 409, code: invalid_transition}}
  # 再上机早于最近一次下机 → 409
  - reticle_mount: {idem: ret-rep-bt11, eq: EAP-LT01, reticle: R-SIM-07, slot: S7, mounted_at: "$now-1h", expect: {status: 409, code: time_out_of_order}}
  # incident：occurred_at 三类边界（R-SIM-08 最近事件为 4:59 上机）
  - reticle_incident: {idem: ret-rep-bt12, eq: EAP-LT01, reticle: R-SIM-08, kind: collision, occurred_at: "2026-10-15T01:00:00",
                       expect: {status: 422, type: timezone_required, loc: [body, occurred_at]}}
  - reticle_incident: {idem: ret-rep-bt13, eq: EAP-LT01, reticle: R-SIM-08, kind: collision, occurred_at: "$now+301s",
                       expect: {status: 422, type: value_error, ctx: {reason: future_time}}}
  - reticle_incident: {idem: ret-rep-bt14, eq: EAP-LT01, reticle: R-SIM-08, kind: collision, occurred_at: "$now-1h",
                       expect: {status: 409, code: time_out_of_order}}
  - reticle_incident: {idem: ret-rep-bt15, eq: EAP-LT01, reticle: R-NOT-EXIST, kind: collision, occurred_at: "$now+301s",
                       expect: {status: 422, type: value_error, ctx: {reason: future_time}}}   # 先于 404
  - reticle_incident: {idem: ret-rep-bt16, eq: EAP-LT01, reticle: R-SIM-08, kind: collision, occurred_at: "$now+300s", expect: {status: 201}}
  - expect_reticle: {reticle: R-SIM-08, fields: {status_code: on_hold}}   # 登记异常 → on_hold，挂着则同事务卸载
  # ---- D82 续二（03:19）：先后基准
  # 1. mount/unmount 基准 = 状态履历与历次下机最晚者，usage / 检查不计：上机后补一次 usage（当前时间），下机时间早于 usage 仍合法
  - reticle_mount: {idem: ret-rep-c1, eq: EAP-LT01, reticle: R-SIM-10, slot: S1, mounted_at: "$now-3h", expect: {status: 200}}
  - reticle_adjust: {idem: ret-rep-c2, reticle: R-SIM-10, delta: "10", expect: {status: 200}}
  - reticle_inspection: {idem: ret-rep-c3, reticle: R-SIM-10, kind: particle, result: pass, expect: {status: 409}}   # in_use 不能检查；即使能录也不计入基准
  - reticle_unmount: {idem: ret-rep-c4, reticle: R-SIM-10, unmounted_at: "$now-2h", expect: {status: 200}}   # 早于 usage，合法
  # 2. incident occurred_at 早于最近一次 usage → 409（R-SIM-10 最近 usage 为当前时间）
  - reticle_incident: {idem: ret-rep-c5, eq: EAP-LT01, reticle: R-SIM-10, kind: collision, occurred_at: "$now-1h",
                       expect: {status: 409, code: time_out_of_order}}
  - expect_reticle: {reticle: R-SIM-10, fields: {status_code: available}}
  # 4. occurred_at 早于当前这次 mounted_at → 整体 409：不 Hold、不下机、不写事件
  - reticle_mount: {idem: ret-rep-c6, eq: EAP-LT01, reticle: R-SIM-11, slot: S2, mounted_at: "$now-2h", save_as: m11, expect: {status: 200}}
  - reticle_incident: {idem: ret-rep-c7, eq: EAP-LT01, reticle: R-SIM-11, kind: collision, occurred_at: "$now-3h",
                       expect: {status: 409, code: time_out_of_order, body: {detail.latest_event_at: $m11.mounted_at}}}   # 386c4e0：基准为本次上机时间（detail 顶层，同 status_code/field）
  - expect_reticle: {reticle: R-SIM-11, fields: {status_code: in_use, hold_reason: null}}
  - expect_reticle_history: {reticle: R-SIM-11, count_of: {incident: 0}, latest_of: mount, fields: {mounted_at: $m11.mounted_at, unmounted_at: null}}
  - expect_reticle_events: {reticle: R-SIM-11, count: {reticle.incident_recorded: 0, reticle.held: 0, reticle.unmounted: 0}}
  # 3. 登记异常顺带下机：带 occurred_at 时下机时间 = occurred_at（回查上机行）
  - reticle_incident: {idem: ret-rep-c8, eq: EAP-LT01, reticle: R-SIM-11, kind: collision, occurred_at: "$now-1h", save_as: inc11,
                       expect: {status: 201}}
  - expect_reticle_history: {reticle: R-SIM-11, latest_of: mount, fields: {mounted_at: $m11.mounted_at, unmounted_at: $inc11.occurred_at}}
  - expect_reticle: {reticle: R-SIM-11, fields: {status_code: on_hold, hold_reason: incident}}
  - expect_reticle_events: {reticle: R-SIM-11, count: {reticle.incident_recorded: 1, reticle.unmounted: 1}}
  # 不带 occurred_at：下机时间为服务器当前时间（只断言 UTC Z 且不为空）
  - reticle_mount: {idem: ret-rep-c9, eq: EAP-LT01, reticle: R-SIM-12, slot: S3, expect: {status: 200}}
  - reticle_incident: {idem: ret-rep-c10, eq: EAP-LT01, reticle: R-SIM-12, kind: drop, expect: {status: 201}}
  - expect_reticle_history: {reticle: R-SIM-12, latest_of: mount, fields: {unmounted_at: $utc_z}}
