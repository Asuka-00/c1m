# 草稿（P3-E1 v0.7 §5/§3.2/§9）：光罩曝光计数上报。P3-B4 接口和 B11 event_type=reticle_usage 都还没有，整体 skipped。
# 后端落地后：去掉 draft，按 openapi 校正路径/字段，再补 runner 步骤实现。
# 覆盖：count_basis=eap 出站先估算（estimated=true）→ EAP 实际 shot（kind=report）修正最早一条未修正估算记录
#       → B11 同 external_event_id 同内容重放（信封 duplicate=true，不重复计）→ 不同内容 422 idempotency_key_reused（D57）
#       → 人工调整 POST /mes/reticle/{id}/usage（kind=adjust 由 delta 推导，负数必带 reason_id）
#       → 调到上限 pending_maintenance → restore 409 life_limit_reached → 调回上限下 restore 200（后端置待检）。
name: reticle-exposure-count
run_id: ret-count-02
draft: "等 P3-B4 光罩接口与 B11 reticle_usage（E1 v0.7：P3 不开放 EAP 计数，eap_service 无光罩写权限）"
target: http://127.0.0.1:8013
equipment: [{code: EAP-LT01, type: LITHO}]
steps:
  - precondition: {eq: EAP-LT01, e10: SBY}
  - reticle_mount: {eq: EAP-LT01, reticle: R-SIM-01, slot: S1, expect: {status: 200, body: {data.status_code: in_use}}}
  - expect_reticle: {reticle: R-SIM-01, fields: {count_basis: eap, mount_count: 1, shot_count: "0"}}
  - track_in: {eq: EAP-LT01, lot: FX0001, reticle: R-SIM-01}
  # 出站前没有 EAP shot：按片折算 25 片 × shots_per_wafer 5 = 125，kind=track_out、estimated=true
  - track_out: {eq: EAP-LT01, lot: FX0001}
  - expect_reticle_history: {reticle: R-SIM-01, latest: {kind: track_out, estimated: true, counted: true, delta: "125"}}
  # EAP 实际值 130：改写最早一条未修正估算记录（estimated=false），shot_count += 5，不新增记录
  - reticle_usage: {eq: EAP-LT01, reticle: R-SIM-01, lot: FX0001, shots: "130",
                    expect: {status: 200, body: {result.data.estimated: false, result.data.delta: "130", duplicate: false}}}
  - expect_reticle: {reticle: R-SIM-01, fields: {shot_count: "130"}}
  # D57（B11）：同 (source, external_event_id) 同内容重放 → 原状态码 200，信封 duplicate=true，不重复加差额
  - replay: {eq: EAP-LT01, seq: 3, expect: {status: 200, body: {duplicate: true}}}
  - expect_reticle: {reticle: R-SIM-01, fields: {shot_count: "130"}}
  - reuse: {eq: EAP-LT01, seq: 3, change: {shots: "140"}}
  # 没有可修正的估算记录 → 另记一条 kind=report、source=eap
  - reticle_usage: {eq: EAP-LT01, reticle: R-SIM-01, lot: FX0002, shots: "10",
                    expect: {status: 200, body: {result.data.kind: report, result.data.estimated: false}}}
  # payload 未知字段 → 422 unknown_field
  - reticle_usage: {eq: EAP-LT01, reticle: R-SIM-01, lot: FX0001, shots: "1", extra: {bogus: 1},
                    expect: {status: 422, code: unknown_field, loc: [body, payload, bogus]}}
  # 人工调整（D66 Q16 / D67）：负数缺 reason_id → 422 列表 [body, reason_id]；kind 不得传；带 reason_id → kind=adjust、source=manual
  - reticle_adjust: {reticle: R-SIM-01, delta: "-5", expect: {status: 422, loc: [body, reason_id]}}
  - reticle_adjust: {reticle: R-SIM-01, delta: "5", extra: {kind: report}, expect: {status: 422, code: unknown_field, loc: [body, kind]}}
  - reticle_adjust: {reticle: R-SIM-01, delta: "-5", reason: RC-ADJ, note: sim,
                     expect: {status: 200, body: {data.kind: adjust, data.source: manual}}}
  # 调到上限（max_shots=200）→ pending_maintenance + reticle.life_reached；restore 409 life_limit_reached
  - reticle_adjust: {reticle: R-SIM-01, delta: "75", expect: {status: 200}}
  - expect_reticle: {reticle: R-SIM-01, fields: {status_code: pending_maintenance, shot_count: "200"}}
  - reticle_restore: {reticle: R-SIM-01, reason: sim restore, expect: {status: 409, code: life_limit_reached}}
  # 调回上限下再 restore：200 → available，后端置 inspection_required=true；请求体带 inspection_required → 422 unknown_field
  - reticle_adjust: {reticle: R-SIM-01, delta: "-10", reason: RC-ADJ, expect: {status: 200}}
  - expect_reticle: {reticle: R-SIM-01, fields: {status_code: pending_maintenance}}   # 不自动恢复
  - reticle_restore: {reticle: R-SIM-01, reason: sim, extra: {inspection_required: false},
                      expect: {status: 422, code: unknown_field, loc: [body, inspection_required]}}
  - reticle_restore: {reticle: R-SIM-01, reason: sim restore, expect: {status: 200}}
  - expect_reticle: {reticle: R-SIM-01, fields: {status_code: available, inspection_required: true}}
  - expect_reticle_history: {reticle: R-SIM-01, latest: {type: state, from: pending_maintenance, to: available, event: reticle.restored}}
