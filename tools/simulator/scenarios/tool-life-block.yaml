# 首批验收场景 2（设计 §6.1）：耗材寿命预警与到期拦截。依赖 B10（d27b700），接口不存在时整体 skipped。
# B10 实际行为：
#   - 计数上报 POST /mes/eqp/tools/{tool_id}/usage，返回 {data, tool: {usage_count, life_state, ...}, duplicate, life_reached}
#   - 预警区间 max_usage × warn_ratio（默认 0.9）<= 用量 < max_usage：Track In 照常 200（规则只给 warn，不拦）
#   - 用量 >= max_usage：Track In 返回 409 check_blocked，检查项 tool_life，overridable=false（只在 track_in 判断，move_in 不判断）
#   - 517b0a0 P2-D3：用满 / 过期 / 不可用时，工步绑定的 tool_life 规则也判 block（和内置硬拦截同一 message），
#     不再出现 "tools available"；断言所有 tool_life 项 result 都是 block（all: [result]）、至少 2 条（内置 + 规则）。
#     f2d890c：规则项也 overridable=false，所以每条都要求 overridable=false（all: true）；c6b5907：409 顶层 overridable=false。
# 前提：T-SIM-01 的 max_usage=1000、warn_ratio 默认 0.9、count_basis=reported（Track Out 不自动计数）；
#       FX0001、FX0003 是 waiting 的批，工步要求 T-SIM-01 的工具类型且绑定了 tool_life 规则；reason_code 里有 REWORK。
name: tool-life-block
run_id: tool-life-05
target: http://127.0.0.1:8013
equipment: [{code: EAP-DA01, type: DIEBOND}]
steps:
  - precondition: {lot: FX0001, lot_status: waiting}
  - precondition: {lot: FX0003, lot_status: waiting}
  - tool_reset: {tool: T-SIM-01, reason: REWORK, expect: {body: {tool.usage_count: "0"}}}   # 从 0 开始，可重复跑
  # 23c502d：工具摘要带实际生效的上限和预警比例（十进制字符串）
  - tool_usage:
      eq: EAP-DA01
      tool: T-SIM-01
      delta: 900
      expect: {body: {tool.life_state: warning, life_reached: false, tool.effective_max_usage: "1000", tool.effective_warn_ratio: "0.9"}}
  - replay: {eq: EAP-DA01, seq: 1, expect: {status: 200, body: {duplicate: true, tool.usage_count: "900"}}}
  - reuse: {eq: EAP-DA01, seq: 1, change: {delta: 50}}   # D57：同事件号换 delta -> 422 idempotency_key_reused
  - expect_tool_log: {tool: T-SIM-01, last: {kind: report, delta: "900", count_after: "900"}}   # 没写入
  # D65 补充 4：执行接口带未知字段 -> 422 unknown_field [body, bogus]，批次不变
  - expect_body_422: {eq: EAP-DA01, endpoint: move_in, lot: FX0001, extra: {bogus: 1}, code: unknown_field, loc: [body, bogus]}
  - move_in: {eq: EAP-DA01, lot: FX0001}
  - track_in: {eq: EAP-DA01, lot: FX0001, tools: [T-SIM-01]}     # 预警区间：可放行，200
  - tool_usage: {eq: EAP-DA01, tool: T-SIM-01, delta: 100, expect: {body: {life_reached: true, tool.tool_status: pending_maintenance}}}
  - move_in: {eq: EAP-DA01, lot: FX0003}
  - track_in:
      eq: EAP-DA01
      lot: FX0003
      tools: [T-SIM-01]
      expect:
        status: 409
        code: check_blocked
        check: {check_type: tool_life, overridable: false, result: block, all: true, min_count: 2, not_message: tools available}
        body: {detail.overridable: false}
  - expect_tool_log: {tool: T-SIM-01, last: {kind: report, delta: "100", count_after: "1000"}}
  # P2-D3 过期：计数清零、状态恢复可用，有效期设成昨天 -> 同样两条 block
  - tool_reset: {tool: T-SIM-01, reason: REWORK, expect: {body: {tool.usage_count: "0"}}}
  - tool_set: {tool: T-SIM-01, fields: {tool_status: available, expiry_date: -1}}
  - track_in:
      eq: EAP-DA01
      lot: FX0003
      tools: [T-SIM-01]
      expect:
        status: 409
        code: check_blocked
        check: {check_type: tool_life, overridable: false, result: block, all: true, min_count: 2, not_message: tools available}
        body: {detail.overridable: false}
  # P2-D3 不可用：去掉有效期，状态改成 retired -> 两条 block
  - tool_set: {tool: T-SIM-01, fields: {expiry_date: null, tool_status: retired}}
  - track_in:
      eq: EAP-DA01
      lot: FX0003
      tools: [T-SIM-01]
      expect:
        status: 409
        code: check_blocked
        check: {check_type: tool_life, overridable: false, result: block, all: true, min_count: 2, not_message: tools available}
        body: {detail.overridable: false}
  # 恢复：可用 + 无有效期 + 计数 0（FX0003 仍停在 move_in 后，未进站）
  - tool_set: {tool: T-SIM-01, fields: {tool_status: available}}
